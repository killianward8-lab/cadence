<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Killian's Cadence</title>
  <link rel="icon" href="assets/poppy-mascot-hd.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Sora:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app-light.css" />
  <link rel="stylesheet" href="deck-light.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="cd">
    <header class="cd-top">
      <div class="cd-brand"><svg class="cd-mark" viewBox="0 0 22 16" aria-hidden="true"><rect x="0" y="5.5" width="2.4" height="5" rx="1.2"></rect><rect x="4.5" y="3" width="2.4" height="10" rx="1.2"></rect><rect x="9" y="0" width="2.4" height="16" rx="1.2"></rect><rect x="13.5" y="3.5" width="2.4" height="9" rx="1.2"></rect><rect x="18" y="6" width="2.4" height="4" rx="1.2"></rect></svg>Cadence</div>
      <a class="cd-back" href="https://getpoppy.ai/killian" title="Your tracker">← /killian</a>
      <nav class="cd-tabs" id="tabs">
        <button data-tab="precall">Pre-call</button>
        <button data-tab="script">Script</button>
        <button data-tab="objections">Objections</button>
        <button data-tab="deck">Deck</button>
        <button data-tab="pay">Pay</button>
      </nav>
      <label class="cd-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input id="q" placeholder="What did they say?" /><kbd>/</kbd></label>
      <button id="practice" class="cd-prac" title="Practice a full close with fake people and test money">🧪 Practice</button>
      <button id="edit" class="cd-editbtn"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"></path><path d="m13.5 6.5 4 4"></path></svg>Edit</button>
      <button id="poppy" class="cd-prac" title="Connect to Poppy">○ Poppy</button>
    </header>
    <div id="editbar" class="cd-editbar" hidden>Edit mode · changes save in this browser · <button id="exportJson">Download cadence.json</button> · <button id="resetEdits">Reset to the repo copy</button></div>
    <div id="pracbar" class="cd-pracbar" hidden>🧪 Practice · a made-up group call. Nobody real is charged, emailed or logged.</div>
    <div id="main" class="cd-body"><div class="cd-none">Loading the script…</div></div>
  </div>

  <div id="present" class="dk-present" hidden></div>
  <div id="toast" class="cd-toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
