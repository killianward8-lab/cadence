<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Killian's Cadence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">▮▮▮</span> Cadence <small>Killian</small></div>
    <nav class="tabs" id="tabs">
      <button data-tab="precall">Pre-call</button>
      <button data-tab="script">Script</button>
      <button data-tab="objections">Objections</button>
      <button data-tab="deck">Deck</button>
      <button data-tab="pay">Pay</button>
    </nav>
    <div class="search"><span>⌕</span><input id="q" placeholder="What did they say?" /><kbd>/</kbd></div>
    <button id="practice" class="pill" title="Practice: a made-up call, test money only">🧪 Practice</button>
    <button id="edit" class="pill" title="Edit the script and objections">✎ Edit</button>
    <button id="poppy" class="pill" title="Connect to Poppy">○ Poppy</button>
  </header>
  <div id="editbar" class="editbar" hidden>Edit mode · changes save in this browser · <button id="exportJson">Download cadence.json</button> · <button id="resetEdits">Reset to the repo copy</button></div>
  <div id="pracbar" class="pracbar" hidden>Practice · a made-up group call. Nobody real is charged, emailed or logged.</div>

  <main id="main"><div class="loading">Loading the script…</div></main>

  <div id="present" class="present" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
